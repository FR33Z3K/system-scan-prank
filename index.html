<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Scan</title>
<style>
  :root{--g:#16c60c;--r:#ff5252;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1e;color:#e8eefc;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:transform 1.2s cubic-bezier(.6,-0.3,.3,1.3);}
  .panel{width:min(520px,92vw);background:#111a30;border:1px solid #223055;border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);padding:26px 28px;}
  .row{display:flex;align-items:center;gap:12px;}
  .shield{font-size:40px;}
  h1{font-size:20px;margin:2px 0;}
  .sub{color:#9fb0d6;font-size:13px;margin:0;}
  .bar{height:12px;border-radius:8px;background:#1d2949;overflow:hidden;margin:20px 0 8px;}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#2e7bff,#16c60c);transition:width .25s;}
  .pct{font-variant-numeric:tabular-nums;font-size:13px;color:#9fb0d6;}
  .log{height:120px;overflow:hidden;margin-top:14px;font-family:ui-monospace,Consolas,monospace;
    font-size:12px;color:#8aa0cc;line-height:1.7;}
  .log div{opacity:.85;}
  .result{display:none;text-align:center;}
  .result.big{display:block;}
  .big-emoji{font-size:72px;}
  .close{margin-top:18px;background:#2e7bff;border:none;color:#fff;padding:10px 18px;border-radius:9px;
    font-size:15px;font-weight:600;cursor:pointer;}
  .hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#5a6aa0;font-size:12px;}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="stage">
  <div class="panel" id="panel">
    <div id="scan">
      <div class="row">
        <div class="shield">🛡️</div>
        <div>
          <h1>Windows Security — Full Scan</h1>
          <p class="sub">Checking your system for threats…</p>
        </div>
      </div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pct">0% — initializing…</div>
      <div class="log" id="log"></div>
    </div>
    <div class="result" id="result">
      <div class="big-emoji">🤡</div>
      <h1 id="rtitle">1 threat found: you</h1>
      <p class="sub" id="rsub">just kidding — nothing was scanned, nothing is wrong. you got pranked 😄</p>
      <button class="close" onclick="document.body.innerHTML='<div class=hint style=\'position:static;margin-top:40vh;font-size:16px\'>ok you can close this tab now 👋</div>'">Phew, close</button>
    </div>
  </div>
</div>
<div class="hint">Security Center • real-time protection</div>
<script>
  const files=["C:\\Windows\\System32\\kernel32.dll","C:\\Users\\Public\\Documents\\taxes_final.xlsx",
    "C:\\Program Files\\Steam\\steam.exe","C:\\Users\\You\\Downloads\\totally_legit.exe",
    "C:\\Windows\\explorer.exe","C:\\Users\\You\\Pictures\\vacation_2025.jpg",
    "C:\\Users\\You\\AppData\\browser\\cookies.db","C:\\Windows\\System32\\drivers\\etc\\hosts",
    "C:\\Users\\You\\Desktop\\homework.docx","C:\\Program Files\\Chrome\\chrome.exe"];
  const log=document.getElementById('log'),fill=document.getElementById('fill'),
    pct=document.getElementById('pct'),panel=document.getElementById('panel'),
    stage=document.getElementById('stage');
  let p=0;
  function addlog(t){const d=document.createElement('div');d.textContent=t;log.prepend(d);
    while(log.children.length>6)log.removeChild(log.lastChild);}
  const iv=setInterval(()=>{
    p+=Math.random()*7+3; if(p>100)p=100;
    fill.style.width=p+'%';
    pct.textContent=Math.floor(p)+'% — scanning '+files[Math.floor(Math.random()*files.length)].split('\\').pop();
    addlog('Scanned: '+files[Math.floor(Math.random()*files.length)]);
    if(p>=72 && !stage.dataset.flipped){stage.dataset.flipped=1;
      panel.style.animation='shake .5s';
      pct.textContent='⚠️ gravity failure detected…';
      stage.style.transform='rotate(180deg)';
      setTimeout(()=>{stage.style.transform='rotate(0deg)';},1400);}
    if(p>=100){clearInterval(iv);
      setTimeout(()=>{document.getElementById('scan').style.display='none';
        document.getElementById('result').classList.add('big');},600);}
  },280);
</script>
</body>
</html>
